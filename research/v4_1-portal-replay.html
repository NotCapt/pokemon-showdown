      gap: 3px !important;

  <script>
    // Dynamic arena auto-scaling to fill 100% of left screen
    function fitArena() {
      var stage = document.querySelector('.arena-stage');
      var battle = document.querySelector('.battle');
      if (!stage) return;
      var w = stage.clientWidth;
      var h = stage.clientHeight;
      if (w <= 0 || h <= 0) return;
      
      // Calculate scale to fill available arena stage
      var scaleW = (w - 16) / 640;
      var scaleH = (h - 16) / 360;
      var scale = Math.min(scaleW, scaleH);
      scale = Math.max(0.6, scale * 0.97);
      
      document.documentElement.style.setProperty('--battle-scale', scale);
      if (battle) {
        battle.style.setProperty('transform', 'translate(-50%, -50%) scale(' + scale + ')', 'important');
        battle.style.setProperty('transform-origin', 'center center', 'important');
        battle.style.setProperty('top', '50%', 'important');
        battle.style.setProperty('left', '50%', 'important');
      }
    }

    window.addEventListener('resize', fitArena);
    window.addEventListener('orientationchange', fitArena);
    document.addEventListener('DOMContentLoaded', fitArena);
    window.addEventListener('load', fitArena);

    // Keep fitArena hooked into Showdown instance
    var hookShowdown = setInterval(function() {
      fitArena();
      if (window.Replays && window.Replays.battle) {
        window.Replays.battle.onResize = fitArena;
      }
    }, 200);
    setTimeout(function() { clearInterval(hookShowdown); }, 5000);

    // Setup log toggle button
    document.addEventListener('DOMContentLoaded', function() {
      var btn = document.getElementById('btnToggleLog');
      var log = document.getElementById('battleLogContainer');
      if (btn && log) {
        btn.addEventListener('click', function() {
          var isVis = log.classList.contains('visible');
          if (isVis) {
            log.classList.remove('visible');
            btn.classList.remove('active');
            btn.textContent = 'Show Battle Log';
          } else {
            log.classList.add('visible');
            btn.classList.add('active');
            btn.textContent = 'Hide Battle Log';
            log.scrollTop = log.scrollHeight;
          }
        });
      }
    });

    window.addEventListener('load', function() {
      fitArena();
      setTimeout(function() {
        fitArena();
        if (window.Replays && window.Replays.battle) {
          if (window.Replays.changeSetting) window.Replays.changeSetting('speed', 'fast');
          window.Replays.play();
        }
      }, 400);
    });
  </script>
