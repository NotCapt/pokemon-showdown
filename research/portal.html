<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=fccf9c57-d938-476e-b357-b70afa5e2397
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
  <title>Pokémon Showdown AI Battle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- LEFT: Only the Pokemon Showdown simulation -->
    <div class="left-simulation">
      <iframe id="showdownFrame" src="/replay/init-3v3-demo" title="Pokemon Showdown Arena"></iframe>
    </div>

    <!-- RIGHT: Barebones uploads, 3-Pokemon selection & customization, button, plain text winner -->
    <div class="right-panel">
      <div class="panel-header">
        <h2>AI Pokémon Battle (3v3)</h2>
      </div>
      
      <!-- Player 1 Section -->
      <div class="player-box">
        <div class="player-box-head">
          <h3>Player 1</h3>
          <button type="button" class="btn-toggle-custom" data-target="p1_custom_wrap">Customize Team</button>
        </div>

        <label class="section-label">Select 3 Pokémon:</label>
        <div class="pokemon-select-row">
          <select id="p1_poke1" class="poke-dropdown" data-player="p1" data-slot="0"></select>
          <select id="p1_poke2" class="poke-dropdown" data-player="p1" data-slot="1"></select>
          <select id="p1_poke3" class="poke-dropdown" data-player="p1" data-slot="2"></select>
        </div>

        <!-- Customization Drawer for P1 -->
        <div id="p1_custom_wrap" class="custom-team-wrap hidden">
          <div id="p1_custom_slots"></div>
        </div>

        <label class="section-label">Upload ML Algorithm (.py):</label>
        <input type="file" id="p1_file" accept=".py" class="file-input">
        <p class="agent-hint">Required: <code>PokemonAgent.decide(self, observation)</code></p>
        
        <div class="sample-row">
          <span>Or sample ML:</span>
          <select id="p1Sample" class="sample-dropdown">
            <option value="neural_net_agent.py" selected>PyTorch Neural Policy Net</option>
            <option value="q_learning_agent.py">Q-Learning RL Agent</option>
            <option value="decision_tree_agent.py">Scikit-Learn Decision Tree</option>
          </select>
        </div>
      </div>

      <!-- Player 2 Section -->
      <div class="player-box">
        <div class="player-box-head">
          <h3>Player 2</h3>
          <button type="button" class="btn-toggle-custom" data-target="p2_custom_wrap">Customize Team</button>
        </div>

        <label class="section-label">Select 3 Pokémon:</label>
        <div class="pokemon-select-row">
          <select id="p2_poke1" class="poke-dropdown" data-player="p2" data-slot="0"></select>
          <select id="p2_poke2" class="poke-dropdown" data-player="p2" data-slot="1"></select>
          <select id="p2_poke3" class="poke-dropdown" data-player="p2" data-slot="2"></select>
        </div>

        <!-- Customization Drawer for P2 -->
        <div id="p2_custom_wrap" class="custom-team-wrap hidden">
          <div id="p2_custom_slots"></div>
        </div>

        <label class="section-label">Upload ML Algorithm (.py):</label>
        <input type="file" id="p2_file" accept=".py" class="file-input">
        <p class="agent-hint">Required: <code>PokemonAgent.decide(self, observation)</code></p>

        <div class="sample-row">
          <span>Or sample ML:</span>
          <select id="p2Sample" class="sample-dropdown">
            <option value="neural_net_agent.py">PyTorch Neural Policy Net</option>
            <option value="q_learning_agent.py" selected>Q-Learning RL Agent</option>
            <option value="decision_tree_agent.py">Scikit-Learn Decision Tree</option>
          </select>
        </div>
      </div>

      <!-- Start Simulation Button -->
      <button id="btnStart" class="btn-start">Start Simulation</button>

      <!-- Show Winner Action & Output -->
      <div class="winner-box">
        <button id="btnShowWinner" class="btn-show-winner" disabled>Show Winner</button>
        <div id="winnerOutput" class="winner-text hidden"></div>
      </div>

      <button id="btnShowError" class="btn-show-error" type="button" disabled>Show Error</button>

      <div class="docs-link-box">
        <a href="/docs" target="_blank">Documentation</a> · 
        <a href="/starter_pack.zip" download>Download Starter Pack (ZIP)</a>
      </div>
    </div>
  </div>

  <div id="errorModal" class="error-modal hidden" role="dialog" aria-modal="true" aria-labelledby="errorModalTitle">
    <div class="error-modal-card">
      <div class="error-modal-header">
        <h2 id="errorModalTitle">Algorithm error</h2>
        <button id="btnCloseError" class="btn-close-error" type="button" aria-label="Close error popup">×</button>
      </div>
      <p>The uploaded algorithm could not be tested:</p>
      <pre id="errorDetails" class="error-details"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
